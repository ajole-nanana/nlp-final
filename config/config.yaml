# config/config.yaml
data:
  train_data: "data/raw/train_data.csv"
  test_data: "data/raw/test_data.csv"
  train_cleaned: "data/processed/cleaned/train_cleaned.csv"
  test_cleaned: "data/processed/cleaned/test_cleaned.csv"
  processed: "data/processed"

model:
  svm:
    kernel: "linear"
    C: 1.0
    max_features: 5000
    ngram_range: [1, 2]

attack:
  simple:
    replace_ratio: 0.3
    max_attempts: 3
  bert:
    top_k: 10
    max_changes: 5
    target_label: 0

experiment:
  test_samples: 100
  random_seed: 42
  save_dir: "experiments/results"